---
# Source: ld-relay/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ld-relay-test
  namespace: ld-relay-test-ns
  labels:
    app.kubernetes.io/name: ld-relay
    app.kubernetes.io/instance: ld-relay-test
    app.kubernetes.io/version: "9.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ld-relay
      app.kubernetes.io/instance: ld-relay-test
  template:
    metadata:
      annotations:
      labels:
        app.kubernetes.io/name: ld-relay
        app.kubernetes.io/instance: ld-relay-test
    spec:
      volumes:
      - name: ld-relay-test-config
        configMap:
          name: ld-relay-test-config
      
      
      serviceAccountName: ld-relay-test
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ld-relay

          env:

          envFrom:
            - configMapRef:
                name: ld-relay-test-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          image: "launchdarkly/ld-relay:9.0.1"
          imagePullPolicy: IfNotPresent
          ports:
              - containerPort: 8030
                protocol: TCP
                name: api
          livenessProbe:
            httpGet:
              path: /status
              port: api
          readinessProbe:
            httpGet:
              path: /status?expect=environments[count]!=0&expect=environments[*].connectionStatus.state!=INITIALIZING&expect=environments[*].dataStoreStatus.state!=INITIALIZING
              port: api
          resources:
            {}
