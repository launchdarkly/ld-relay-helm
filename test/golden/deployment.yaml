---
# Source: ld-relay/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ld-relay-test
  namespace: ld-relay-test-ns
  labels:
    app.kubernetes.io/name: ld-relay
    app.kubernetes.io/instance: ld-relay-test
    app.kubernetes.io/version: "8.23.2"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ld-relay
      app.kubernetes.io/instance: ld-relay-test
  template:
    metadata:
      annotations:
      labels:
        app.kubernetes.io/name: ld-relay
        app.kubernetes.io/instance: ld-relay-test
    spec:
      volumes:
      - name: ld-relay-test-config
        configMap:
          name: ld-relay-test-config
      
      
      # Writable scratch space so the container can run with a read-only root
      # filesystem. Offline mode expands its archive under TMPDIR.
      - name: ld-relay-tmp
        emptyDir: {}
      serviceAccountName: ld-relay-test
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ld-relay
          volumeMounts:
            - name: ld-relay-tmp
              mountPath: /tmp

          env:

          envFrom:
            - configMapRef:
                name: ld-relay-test-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          image: "launchdarkly/ld-relay:8.23.2"
          imagePullPolicy: IfNotPresent
          ports:
              - containerPort: 8030
                protocol: TCP
                name: api
          livenessProbe:
            httpGet:
              path: /status
              port: api
          readinessProbe:
            httpGet:
              path: /status
              port: api
          resources:
            {}
